# Local infrastructure for F2 (persistence + queue) and `npm run test:integration`.
#
#   docker compose up -d
#   export DATABASE_URL="postgresql://agentos:agentos@localhost:5432/agent_os"
#   export REDIS_URL="redis://localhost:6379"
#   npm run db:migrate            # apply prisma/migrations
#   npm run test:integration
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agent_os
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agent_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

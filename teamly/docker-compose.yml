# Local Postgres for teamly (T1).
#
#   docker compose up -d
#   export DATABASE_URL="postgresql://teamly:teamly@localhost:5432/teamly"
#   npm run db:migrate && npm run db:seed && npm run dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: teamly
      POSTGRES_PASSWORD: teamly
      POSTGRES_DB: teamly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamly -d teamly"]
      interval: 5s
      timeout: 5s
      retries: 10

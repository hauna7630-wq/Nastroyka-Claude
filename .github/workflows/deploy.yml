name: Deploy

# Builds both app images, pushes them to GHCR, then SSHes to the host and brings
# the stack up. Each app applies its own migrations on startup.
# Trigger manually, or on push to a release branch. Configure the secrets listed
# in deploy/README.md first.

on:
  workflow_dispatch:
  push:
    branches: [release]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push agent-os
        uses: docker/build-push-action@v6
        with:
          context: ./agent-os
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agent-os:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push teamly
        uses: docker/build-push-action@v6
        with:
          context: ./teamly
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/teamly:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy files to the host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/postgres-init/01-init.sql"
          target: "app"
          strip_components: 1
      - name: Pull images + bring the stack up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/app
            cat > .env <<EOF
            IMAGE_PREFIX=ghcr.io/${{ github.repository_owner }}
            POSTGRES_USER=app
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            ANTHROPIC_BASE_URL=${{ secrets.ANTHROPIC_BASE_URL }}
            CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}
            HTTP_PROXY=${{ secrets.HTTPS_PROXY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            ALLOWLIST_DOMAINS=${{ secrets.ALLOWLIST_DOMAINS }}
            TEAMLY_DOMAIN=${{ secrets.TEAMLY_DOMAIN }}
            AGENT_DOMAIN=${{ secrets.AGENT_DOMAIN }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            EOF
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            echo "===== E2E CHAT TEST (via Caddy, like the browser) ====="
            sleep 15
            H="Host: ${{ secrets.AGENT_DOMAIN }}"
            AID=$(curl -sk -H "$H" https://127.0.0.1/orgs/demo/agents | python3 -c "import sys,json;a=json.load(sys.stdin);print(next((x['id'] for x in a if 'Iskara' in x.get('name','')), a[0]['id'] if a else ''))" 2>/dev/null)
            echo "agent id: $AID"
            if [ -n "$AID" ]; then
              RID=$(curl -sk -H "$H" -H 'content-type: application/json' -X POST https://127.0.0.1/runs -d "{\"orgId\":\"demo\",\"agentId\":\"$AID\",\"input\":{\"prompt\":\"Кратко в одном предложении представься.\"}}" | python3 -c "import sys,json;print(json.load(sys.stdin).get('runId',''))" 2>/dev/null)
              echo "run id: $RID"
              for i in $(seq 1 45); do
                sleep 2
                S=$(curl -sk -H "$H" https://127.0.0.1/runs/$RID | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('run',{});print(r.get('status',''),'||out:',str(r.get('output',''))[:300],'||err:',str(r.get('error',''))[:200])" 2>/dev/null)
                echo "poll $i: $S"
                case "$S" in succeeded*|failed*|canceled*) break;; esac
              done
            fi
            echo "===== agentos logs (tail) ====="
            docker compose -f docker-compose.prod.yml logs --tail=30 agentos

name: Deploy

# Builds both app images, pushes them to GHCR, then SSHes to the host and brings
# the stack up. Each app applies its own migrations on startup.
# Trigger manually, or on push to a release branch. Configure the secrets listed
# in deploy/README.md first.

on:
  workflow_dispatch:
  push:
    branches: [release, claude/inspiring-ride-OUkyL]
    # On the feature branch, only a change to this file triggers a deploy
    # (same self-trigger pattern as usbox.yml) — lets CI deploy without the
    # GitHub API when the MCP session is down.
    paths: ['.github/workflows/deploy.yml']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push agent-os
        uses: docker/build-push-action@v6
        with:
          context: ./agent-os
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agent-os:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push teamly
        uses: docker/build-push-action@v6
        with:
          context: ./teamly
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/teamly:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy files to the host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,deploy/postgres-init/01-init.sql"
          target: "app"
          strip_components: 1
      - name: Pull images + bring the stack up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/app
            cat > .env <<EOF
            IMAGE_PREFIX=ghcr.io/${{ github.repository_owner }}
            POSTGRES_USER=app
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            ANTHROPIC_BASE_URL=${{ secrets.ANTHROPIC_BASE_URL }}
            CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}
            HTTP_PROXY=${{ secrets.HTTPS_PROXY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            ALLOWLIST_DOMAINS=${{ secrets.ALLOWLIST_DOMAINS }}
            TEAMLY_DOMAIN=${{ secrets.TEAMLY_DOMAIN }}
            AGENT_DOMAIN=${{ secrets.AGENT_DOMAIN }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            EOF
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            set +e
            echo "===== SEED expert team (idempotent) ====="
            sleep 12
            docker compose -f docker-compose.prod.yml exec -T agentos node prisma/seed.prod.cjs || echo "seed failed"
            echo "===== E2E CHAT TEST (node inside agentos) ====="
            echo "" | base64 -d > /tmp/e2e.cjs
            docker compose -f docker-compose.prod.yml cp /tmp/e2e.cjs agentos:/tmp/e2e.cjs
            docker compose -f docker-compose.prod.yml exec -T agentos node /tmp/e2e.cjs
            echo "===== Caddy-served HTML (exact browser path) ====="
            curl -sk --resolve ${{ secrets.AGENT_DOMAIN }}:443:127.0.0.1 https://${{ secrets.AGENT_DOMAIN }}/ -o /tmp/c.html -w "code=%{http_code} size=%{size_download}\n"
            echo "markers: v24=$(grep -c 'v24' /tmp/c.html) Сотрудники=$(grep -c Сотрудники /tmp/c.html) spriteRows=$(grep -c spriteRows /tmp/c.html) chatReply=$(grep -c chatReply /tmp/c.html) phaseBar=$(grep -c phaseBar /tmp/c.html) loadJournal=$(grep -c loadJournal /tmp/c.html) sideStaff=$(grep -c sideStaff /tmp/c.html) hireGrid=$(grep -c hireGrid /tmp/c.html) loadChatHistory=$(grep -c loadChatHistory /tmp/c.html) emojipop=$(grep -c emojipop /tmp/c.html)"
            echo "===== EXTRACT ENDPOINT (docx happy-path + honest .doc error) ====="
            curl -s -X POST -H 'content-type: application/json' --resolve ${{ secrets.AGENT_DOMAIN }}:443:127.0.0.1 -k https://${{ secrets.AGENT_DOMAIN }}/documents/extract -d '{"mime":"text/csv","filename":"t.csv","content":"'$(printf 'a,b\n1,2' | base64 -w0)'"}'; echo
            curl -s -X POST -H 'content-type: application/json' --resolve ${{ secrets.AGENT_DOMAIN }}:443:127.0.0.1 -k https://${{ secrets.AGENT_DOMAIN }}/documents/extract -d '{"mime":"application/msword","filename":"old.doc","content":"eHh4"}'; echo
            echo "===== CHAT MEMORY (close-tab-and-return: reply persisted server-side) ====="
            BASE="https://${{ secrets.AGENT_DOMAIN }}"; RES="--resolve ${{ secrets.AGENT_DOMAIN }}:443:127.0.0.1 -k"
            AID=$(curl -s $RES "$BASE/orgs/demo/agents" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "chat agent id=$AID"
            CRID=$(curl -s $RES -X POST -H 'content-type: application/json' "$BASE/orgs/demo/agents/$AID/chat" -d '{"text":"Ответь одним словом: тест"}' | grep -o '"runId":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "chat runId=$CRID"
            for i in $(seq 1 60); do sleep 3; S=$(curl -s $RES "$BASE/runs/$CRID" | grep -o '"status":"[^"]*"' | head -1); echo -n " $S"; echo "$S" | grep -q succeeded && break; echo "$S" | grep -qE 'failed|canceled' && break; done; echo
            echo "===== REACTIONS (toggle 👍 on first message) ====="
            MID=$(curl -s $RES "$BASE/orgs/demo/agents/$AID/chat" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
            curl -s $RES -X POST -H 'content-type: application/json' "$BASE/orgs/demo/agents/$AID/messages/$MID/react" -d '{"emoji":"👍"}' | grep -o '"reactions":\[[^]]*\]'; echo
            echo "history after 'reopen':"; curl -s $RES "$BASE/orgs/demo/agents/$AID/chat" | grep -o '"role":"[^"]*"' | tr '\n' ' '; echo
            echo "===== INSTALLED SKILLS ====="
            docker compose -f docker-compose.prod.yml exec -T agentos sh -lc 'echo count=$(ls -1 /root/.claude/skills 2>/dev/null | wc -l); ls -1 /root/.claude/skills 2>/dev/null | head -50'
            echo "===== agentos logs (tail) ====="
            docker compose -f docker-compose.prod.yml logs --tail=20 agentos
            echo "===== E2E DONE ====="
